<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - DevCoder.OJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .auth-card { max-width: 480px; margin: 3rem auto; }
        .auth-logo { font-size: 1.5rem; font-weight: 700; }
    </style>
</head>
<body>
    <div class="container auth-card">
        <div class="text-center mb-4">
            <a href="index.html" class="text-decoration-none auth-logo text-dark">
                <i class="fa-solid fa-terminal text-primary me-2"></i>DevCoder<span class="text-danger">.OJ</span>
            </a>
            <p class="text-muted mt-2 mb-0">Tạo tài khoản học sinh THCS Lê Tấn Bê</p>
        </div>

        <div class="card shadow-sm p-4">
            <h4 class="fw-bold text-dark mb-3">Đăng ký tài khoản</h4>
            <div id="register-error" class="alert alert-danger d-none py-2 text-sm"></div>

            <form id="register-form">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold text-sm">Tên đăng nhập *</label>
                        <input type="text" id="username" class="form-control" placeholder="nguyen_van_a" required pattern="[a-z0-9_]{3,20}">
                        <div class="form-text">3-20 ký tự: chữ thường, số, _</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold text-sm">Mật khẩu *</label>
                        <input type="password" id="password" class="form-control" placeholder="Ít nhất 6 ký tự" required minlength="6">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold text-sm">Họ và tên *</label>
                    <input type="text" id="name" class="form-control" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold text-sm">Lớp *</label>
                        <input type="text" id="class" class="form-control" placeholder="Lớp 9/11" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold text-sm">Trường *</label>
                        <input type="text" id="school" class="form-control" value="THCS Lê Tấn Bê" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold text-sm">Ngôn ngữ yêu thích</label>
                    <select id="lang" class="form-select">
                        <option value="C++ (GCC 17)">C++ (GCC 17)</option>
                        <option value="Python 3.10">Python 3.10</option>
                    </select>
                </div>
                <button type="submit" id="register-btn" class="btn btn-primary w-100 fw-medium">
                    <i class="fa-solid fa-user-plus me-1"></i> Tạo tài khoản
                </button>
            </form>

            <p class="text-center text-muted text-sm mt-3 mb-0">
                Đã có tài khoản? <a href="login.html" class="fw-semibold">Đăng nhập</a>
            </p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
