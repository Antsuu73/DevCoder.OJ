<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho bài tập - DevCoder.OJ</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/main.css">
    
    <style>
        /* CSS tuỳ chỉnh cho trang danh sách bài tập */
        .filter-card {
            background-color: #ffffff;
            border: 1px solid var(--cf-border);
            border-radius: 6px;
        }
        .problem-search-input {
            border: 1px solid var(--cf-border);
            border-radius: 4px;
            padding: 0.4rem 0.8rem;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s ease;
        }
        .problem-search-input:focus {
            border-color: var(--cf-link);
            box-shadow: 0 0 0 0.2rem rgba(49, 94, 251, 0.15);
        }
        .difficulty-btn {
            border: 1px solid var(--cf-border);
            background: #fff;
            color: var(--cf-text-main);
            padding: 0.4rem 1rem;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .difficulty-btn:hover {
            background-color: #f1f3f5;
        }
        .difficulty-btn.active {
            background-color: var(--cf-link);
            border-color: var(--cf-link);
            color: #fff;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top py-3 animate-fade-in">
        <div class="container">
            <a class="navbar-brand fw-bold text-glow" href="index.html">
                <i class="fa-solid fa-terminal me-2 text-cyber"></i>DevCoder<span class="text-neon">.OJ</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-2 ms-4">
                    <li class="nav-item"><a class="nav-link active" href="problems.html"><i class="fa-solid fa-code me-2"></i>Problems</a></li>
                    <li class="nav-item"><a class="nav-link" href="tasks.html"><i class="fa-solid fa-list-check me-2"></i>Task</a></li>
                </ul>
                <div class="navbar-nav d-flex flex-row align-items-center gap-1" id="auth-nav"></div>
            </div>
        </div>
    </nav>

    <div class="container mt-4 animate-slide-up">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold text-dark m-0"><i class="fa-solid fa-square-poll-horizontal text-primary me-2"></i>Kho Bài Tập Thuật Toán</h2>
                <p class="text-muted m-0 mt-1">Danh sách bài tập lập trình phân loại theo độ khó phục vụ đội tuyển HSG.</p>
            </div>
            <a href="index.html" class="btn btn-outline-secondary btn-sm">
                <i class="fa-solid fa-house me-1"></i> Về Trang chủ
            </a>
        </div>

        <!-- Khung Tìm kiếm & Bộ lọc độ khó -->
        <div class="filter-card p-3 mb-4 shadow-sm">
            <div class="row g-3 align-items-center">
                <!-- Search Input -->
                <div class="col-md-5">
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="text" id="search-input" class="form-control problem-search-input border-start-0 ps-0" placeholder="Tìm kiếm theo mã bài hoặc tên bài...">
                    </div>
                </div>
                <!-- Difficulty Filters -->
                <div class="col-md-7 text-md-end">
                    <span class="text-secondary me-2 text-sm fw-semibold d-inline-block mb-1">Mức độ:</span>
                    <div class="btn-group flex-wrap gap-1" role="group">
                        <button type="button" class="difficulty-btn active" data-difficulty="all">Tất cả</button>
                        <button type="button" class="difficulty-btn" data-difficulty="Dễ">Dễ</button>
                        <button type="button" class="difficulty-btn" data-difficulty="Trung bình">Trung bình</button>
                        <button type="button" class="difficulty-btn" data-difficulty="Khó">Khó</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bảng danh sách bài tập -->
        <div class="card shadow-sm rounded-3 overflow-hidden border-0">
            <div class="table-responsive">
                <table class="table cf-problem-table table-hover align-middle m-0">
                    <thead>
                        <tr>
                            <th class="ps-3" style="width: 15%">Mã Bài (ID)</th>
                            <th style="width: 50%">Tên Bài Tập</th>
                            <th style="width: 15%" class="text-center">Độ Khó</th>
                            <th style="width: 10%" class="text-center">Tỷ Lệ AC</th>
                            <th style="width: 10%" class="text-center pe-3">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="problems-list-body">
                        <!-- Nội dung sẽ được tạo động bằng JavaScript -->
                        <tr>
                            <td colspan="5" class="text-center py-4 text-secondary">
                                <i class="fa-solid fa-spinner fa-spin me-2"></i> Đang tải danh sách bài tập...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Thông báo khi không tìm thấy bài -->
        <div id="no-problems-alert" class="alert alert-warning text-center mt-3 d-none">
            <i class="fa-solid fa-triangle-exclamation me-2"></i> Không tìm thấy bài tập nào khớp với bộ lọc tìm kiếm của bạn.
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth-nav.js"></script>
    <script src="js/problems-list.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
