<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - DevCoder.OJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .auth-card { max-width: 420px; margin: 4rem auto; }
        .auth-logo { font-size: 1.5rem; font-weight: 700; }
    </style>
</head>
<body>
    <div class="container auth-card">
        <div class="text-center mb-4">
            <a href="index.html" class="text-decoration-none auth-logo text-dark">
                <i class="fa-solid fa-terminal text-primary me-2"></i>DevCoder<span class="text-danger">.OJ</span>
            </a>
            <p class="text-muted mt-2 mb-0">Đăng nhập để nộp bài và theo dõi tiến độ</p>
        </div>

        <div class="card shadow-sm p-4">
            <h4 class="fw-bold text-dark mb-3">Đăng nhập</h4>
            <div id="login-error" class="alert alert-danger d-none py-2 text-sm"></div>

            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label fw-semibold text-sm">Tên đăng nhập</label>
                    <input type="text" id="username" class="form-control" placeholder="vd: nguyen_van_a" required autocomplete="username">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold text-sm">Mật khẩu</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••" required autocomplete="current-password">
                </div>
                <button type="submit" id="login-btn" class="btn btn-primary w-100 fw-medium">
                    <i class="fa-solid fa-right-to-bracket me-1"></i> Đăng nhập
                </button>
            </form>

            <p class="text-center text-muted text-sm mt-3 mb-0">
                Chưa có tài khoản? <a href="register.html" class="fw-semibold">Đăng ký ngay</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
